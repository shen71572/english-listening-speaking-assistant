# Build Android APK from the static web app.
# Adapted from Narottam04/action-capacitor-android (MIT)
# https://github.com/Narottam04/action-capacitor-android
# Changes for this repo: branch main (not master); static site is prebuilt
# (www/index.html), so `npm run build` is a no-op; Node 20 + Java 21 for
# Capacitor 7 (7.6.10's build.gradle requires Java 21; Java 17 failed run
# #2 with "invalid source release: 21"). Signed .aab + GitHub Release steps
# were REMOVED 2026-11-22:
# GitHub's validator rejects `secrets` in step `if:` conditions, which made
# the whole workflow file invalid (run #1 failed before starting). Re-add
# the release steps when RELEASE_KEYSTORE / RELEASE_KEYSTORE_PASSWORD /
# ACCESS_TOKEN are configured.
name: Build Android

run-name: Building Android APK from static site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (prebuilt static site, no-op)
        run: npm run build

      - name: Add android folder if not present
        run: if [ ! -d "./android" ]; then npx cap add android; fi

      - name: Capacitor sync
        run: npx cap sync

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # NOTE: signed .aab + GitHub Release steps were removed (2026-11-22).
      # GitHub's validator rejects `secrets` in step `if:` conditions, so the
      # whole workflow file was invalid and run #1 never started. Re-add the
      # release steps when the signing secrets are configured.
