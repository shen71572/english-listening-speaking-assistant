# Build Android APK from the static web app.
# Adapted from Narottam04/action-capacitor-android (MIT)
# https://github.com/Narottam04/action-capacitor-android
# Changes for this repo: branch main (not master); static site is prebuilt
# (www/index.html), so `npm run build` is a no-op; Node 20 + Java 17 for
# Capacitor 7; debug APK is always uploaded as an artifact (no secrets
# needed); signed .aab + GitHub Release only run when the signing secrets
# (RELEASE_KEYSTORE / RELEASE_KEYSTORE_PASSWORD / ACCESS_TOKEN) exist.
name: Build Android

run-name: Building Android APK from static site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (prebuilt static site, no-op)
        run: npm run build

      - name: Add android folder if not present
        run: if [ ! -d "./android" ]; then npx cap add android; fi

      - name: Capacitor sync
        run: npx cap sync

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build app bundle (only when signing secrets exist)
        if: ${{ secrets.RELEASE_KEYSTORE != '' }}
        run: cd android && ./gradlew bundleRelease

      - name: Extract Android signing key from env
        if: ${{ secrets.RELEASE_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > android/release.jks.base64
          base64 -d android/release.jks.base64 > android/release.decrypted.jks

      - name: Sign release bundle
        if: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.RELEASE_KEYSTORE_PASSWORD != '' }}
        run: jarsigner -keystore android/release.decrypted.jks -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" -signedjar ./android/app/build/outputs/bundle/release/app-release-signed.aab ./android/app/build/outputs/bundle/release/app-release.aab release

      - name: Set Tag
        if: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.ACCESS_TOKEN != '' }}
        id: current-datetime
        run: echo "CURRENT_DATETIME=$(date +'%Y-%m-%d-%H_%M_%S%z')" >> "$GITHUB_OUTPUT"

      - name: Create Release with signed AAB + debug APK
        if: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.ACCESS_TOKEN != '' }}
        run: |
          gh release create "${{ steps.current-datetime.outputs.CURRENT_DATETIME }}" \
            -t "${{ steps.current-datetime.outputs.CURRENT_DATETIME }}" \
            ./android/app/build/outputs/bundle/release/app-release-signed.aab \
            ./android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
